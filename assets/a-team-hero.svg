<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The A-Team — Physical AI for the Factory Floor</title>
  <desc id="desc">A dark industrial technology banner showing three connected challenge paths: inspect, understand, and act.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#10243B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="196" y1="0" x2="976" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76B900"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#8FA7BF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="-40" r="250" fill="#76B900" fill-opacity="0.06"/>
  <circle cx="112" cy="450" r="260" fill="#22D3EE" fill-opacity="0.06"/>

  <path d="M58 54H245L278 82H455" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="58" cy="54" r="5" fill="#76B900" filter="url(#glow)"/>
  <path d="M1140 390H1032L994 376H855" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="1140" cy="390" r="5" fill="#A855F7" filter="url(#glow)"/>

  <text x="72" y="117" fill="#76B900" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">ROCKWELL AUTOMATION × NVIDIA INNOVATION LAB</text>
  <text x="68" y="203" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">THE A-TEAM</text>
  <text x="72" y="247" fill="#B7C5D6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Physical AI for the factory floor</text>

  <g transform="translate(72 292)">
    <rect width="312" height="76" rx="14" fill="url(#glass)" stroke="#76B900" stroke-opacity="0.55"/>
    <circle cx="40" cy="38" r="19" stroke="#76B900" stroke-width="3"/>
    <circle cx="40" cy="38" r="7" fill="#76B900"/>
    <path d="M53 51L66 64" stroke="#76B900" stroke-width="4" stroke-linecap="round"/>
    <text x="83" y="33" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">INSPECT</text>
    <text x="83" y="55" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Find defects before escape</text>
  </g>

  <g transform="translate(444 292)">
    <rect width="312" height="76" rx="14" fill="url(#glass)" stroke="#22D3EE" stroke-opacity="0.55"/>
    <path d="M27 46C34 31 47 27 60 35C66 39 69 44 71 49" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="35" r="5" fill="#22D3EE"/>
    <path d="M27 52H71" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
    <text x="83" y="33" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">UNDERSTAND</text>
    <text x="83" y="55" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Explain process and cause</text>
  </g>

  <g transform="translate(816 292)">
    <rect width="312" height="76" rx="14" fill="url(#glass)" stroke="#A855F7" stroke-opacity="0.55"/>
    <path d="M29 54L40 28L50 48L61 23L70 54" stroke="#A855F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="83" y="33" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">ACT</text>
    <text x="83" y="55" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Close the loop on hardware</text>
  </g>

  <path d="M384 330H435" stroke="#6F859B" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M756 330H807" stroke="#6F859B" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="410" cy="330" r="4" fill="#9BB0C5"/>
  <circle cx="782" cy="330" r="4" fill="#9BB0C5"/>
</svg>
