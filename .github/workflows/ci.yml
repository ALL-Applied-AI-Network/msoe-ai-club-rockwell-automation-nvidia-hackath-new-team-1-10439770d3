name: repository checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e software/robot-control pytest
      - name: Public release preflight
        run: python scripts/check_public_release.py
      - name: Robot-control tests
        run: python -m pytest software/robot-control/tests -q
      - name: Observation-only contract tests
        env:
          PYTHONPATH: software
        run: python -m pytest software/truck_benchmark/test_benchmark.py -q

