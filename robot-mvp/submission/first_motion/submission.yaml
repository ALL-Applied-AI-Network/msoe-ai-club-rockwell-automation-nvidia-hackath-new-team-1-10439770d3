# First commissioning request for the A-Team's human-gated policy.
# scripts/prepare_first_motion.ps1 replaces the contact placeholders before
# copying this file into the official SIDC client.

team: The A-Team
contact: __CONTACT_NAME__, __CONTACT_EMAIL__
policy: ATeam-SafeMotion-v1

# Human-gated task planning plus the official deterministic motion interface.
model_type: Hybrid

task_id: ateam-safe-motion-A
task: Move the open gripper between two approved points above the default scene without contacting any object.

# The empty placement file means the organizers' documented default scene:
# eight screws and the yellow bin in the same positions for each rollout.
objects: same
layout: same

# Three commissioning attempts are enough to establish the connection and
# repeatability before requesting a full ten-rollout experiment.
rollouts: 3

custom_hardware: none
